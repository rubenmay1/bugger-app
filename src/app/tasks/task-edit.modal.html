<div class="backdrop" *ngIf="open && task" (click)="close()">
  <div class="bottom-panel" (click)="$event.stopPropagation()">
    <p class="panel-title">Edit Task</p>

    <p class="panel-section-label">Name</p>
    <input
      class="text-input"
      type="text"
      placeholder="Task name"
      [(ngModel)]="name"
      maxlength="120"
    />

    <p class="panel-section-label">Deadline</p>
    <p class="current-deadline">Currently: {{ currentDeadlineLabel }}</p>
    <div class="deadline-grid">
      <button
        type="button"
        class="deadline-btn span-2"
        [class.selected]="selected === 'keep'"
        (click)="select('keep')"
      >Keep current</button>
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'today'"
        [disabled]="todayDisabled"
        (click)="select('today')"
      >Today</button>
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'tomorrow'"
        (click)="select('tomorrow')"
      >Tomorrow</button>
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'inWeek'"
        (click)="select('inWeek')"
      >In a Week</button>
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'inMonth'"
        (click)="select('inMonth')"
      >In a Month</button>
    </div>

    <div class="remind-row">
      <span class="remind-label">Remind me</span>
      <ion-toggle [(ngModel)]="remindMe"></ion-toggle>
    </div>

    <div class="panel-actions">
      <ion-button expand="block" [disabled]="!canSubmit" (click)="submit()">
        <ion-icon slot="start" name="checkmark-outline"></ion-icon>
        Save
      </ion-button>
      <ion-button expand="block" class="btn-delete" (click)="confirmDelete()">
        <ion-icon slot="start" name="trash-outline"></ion-icon>
        Delete
      </ion-button>
    </div>
  </div>
</div>
