<div class="backdrop" *ngIf="open" (click)="close()">
  <div class="bottom-panel" (click)="$event.stopPropagation()">
    <p class="panel-title">New Task</p>

    <p class="panel-section-label">Name</p>
    <input
      #nameInput
      class="text-input"
      type="text"
      placeholder="What needs doing?"
      [(ngModel)]="name"
      maxlength="120"
    />

    <p class="panel-section-label">Deadline</p>
    <div class="deadline-grid">
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'today'"
        [disabled]="todayDisabled"
        (click)="select('today')"
      >Today</button>
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'tomorrow'"
        (click)="select('tomorrow')"
      >Tomorrow</button>
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'inWeek'"
        (click)="select('inWeek')"
      >In a Week</button>
      <button
        type="button"
        class="deadline-btn"
        [class.selected]="selected === 'inMonth'"
        (click)="select('inMonth')"
      >In a Month</button>
    </div>

    <div class="remind-row">
      <span class="remind-label">Remind me</span>
      <ion-toggle [(ngModel)]="remindMe"></ion-toggle>
    </div>

    <div class="panel-actions">
      <ion-button expand="block" [disabled]="!canSubmit" (click)="submit()">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Add task
      </ion-button>
      <ion-button expand="block" fill="outline" (click)="close()">Cancel</ion-button>
    </div>
  </div>
</div>
