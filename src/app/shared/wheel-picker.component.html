<div class="wheel">
  <div class="wheel-mask" aria-hidden="true"></div>
  <div class="wheel-selection" aria-hidden="true"></div>
  <div #list class="wheel-list" (scroll)="onScroll()">
    <div class="wheel-spacer" [style.height.px]="padding"></div>
    <div
      class="wheel-item"
      *ngFor="let item of items"
      [style.height.px]="itemHeight"
      [class.active]="item === value"
    >{{ format(item) }}</div>
    <div class="wheel-spacer" [style.height.px]="padding"></div>
  </div>
</div>
